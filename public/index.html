<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Accesos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <div class="brand">
                <div class="brand-badge" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <div>
                    <h1>Sistema de Control de Accesos</h1>
                    <p class="brand-subtitle">Registro de entradas y salidas del edificio</p>
                </div>
            </div>
            <div class="clock" aria-label="Hora actual">
                <span id="fecha"></span>
                <strong id="hora"></strong>
            </div>
        </div>
    </header>

    <main class="container">

        <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

        <section class="stats-grid" aria-label="Estadísticas">
            <article class="stat-card">
                <div class="stat-icon" data-accent="indigo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="statDentro">0</span>
                    <span class="stat-label">Personas dentro</span>
                </div>
            </article>

            <article class="stat-card">
                <div class="stat-icon" data-accent="sky">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="statTotal">0</span>
                    <span class="stat-label">Accesos registrados</span>
                </div>
            </article>

            <article class="stat-card">
                <div class="stat-icon" data-accent="emerald">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="statSalidas">0</span>
                    <span class="stat-label">Salidas registradas</span>
                </div>
            </article>

            <article class="stat-card">
                <div class="stat-icon" data-accent="amber">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
                        <circle cx="7" cy="17" r="2"/>
                        <path d="M9 17h6"/>
                        <circle cx="17" cy="17" r="2"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="statVehiculos">0</span>
                    <span class="stat-label">Accesos con vehículo</span>
                </div>
            </article>
        </section>

        <section class="grid-main">
            <article class="card">
                <h2>Registrar entrada</h2>
                <form id="formEntrada" class="form">
                    <div class="form-group" id="grupoNombre">
                        <label for="nombre">Nombre completo</label>
                        <input id="nombre" type="text" placeholder="Ej. Juan Pérez" autocomplete="name" required>
                    </div>
                    <div class="form-group" id="grupoResidente" hidden>
                        <label for="residente">Residente</label>
                        <select id="residente" required>
                            <option value="">Selecciona un residente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tipo">Tipo de visitante</label>
                        <select id="tipo" required>
                            <option value="">Selecciona un tipo</option>
                            <option value="Residente">Residente</option>
                            <option value="Familia">Familia</option>
                            <option value="Proveedor">Proveedor</option>
                            <option value="Taxi / Uber / Didi">Taxi / Uber / Didi</option>
                            <option value="Técnico">Técnico</option>
                            <option value="Repartidor">Repartidor</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="departamento">Departamento</label>
                        <input id="departamento" type="text" placeholder="Ej. 201" required>
                    </div>
                    <div class="form-group">
                        <label for="placas">Placas (opcional)</label>
                        <input id="placas" type="text" placeholder="Ej. ABC-123">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        </svg>
                        Registrar entrada
                    </button>
                </form>
            </article>

            <article class="card">
                <h2>Dentro del edificio</h2>
                <div id="dentroLista" class="dentro-lista">
                    <p class="vacio">Cargando…</p>
                </div>
            </article>
        </section>

        <section class="card historial">
            <div class="card-header">
                <h2>Historial de accesos</h2>
                <select id="filtroTipo" class="select-filtro" aria-label="Filtrar por tipo">
                    <option value="">Todos los tipos</option>
                    <option value="Residente">Residente</option>
                    <option value="Familia">Familia</option>
                    <option value="Proveedor">Proveedor</option>
                    <option value="Taxi / Uber / Didi">Taxi / Uber / Didi</option>
                    <option value="Técnico">Técnico</option>
                    <option value="Repartidor">Repartidor</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div id="historialTabla" class="historial-tabla">
                <p class="vacio">Cargando…</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
