<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Control de Accesos</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Control de Accesos</h1>

    <p>
        Administración de residentes y visitas
    </p>

</header>


<main>

    <!-- ======================================
         REGISTRAR VISITA
    ======================================= -->

    <section>

        <h2>Registrar Visita</h2>

        <form id="visitaForm">

            <label for="departamento">
                Departamento
            </label>

            <select id="departamento" required>

                <option value="">
                    Seleccionar departamento...
                </option>

                <optgroup label="Piso 1">
                    <option value="101">101</option>
                    <option value="102">102</option>
                    <option value="103">103</option>
                    <option value="104">104</option>
                </optgroup>

                <optgroup label="Piso 2">
                    <option value="201">201</option>
                    <option value="202">202</option>
                    <option value="203">203</option>
                    <option value="204">204</option>
                </optgroup>

                <optgroup label="Piso 3">
                    <option value="301">301</option>
                    <option value="302">302</option>
                    <option value="303">303</option>
                    <option value="304">304</option>
                </optgroup>

                <optgroup label="Piso 4">
                    <option value="401">401</option>
                    <option value="402">402</option>
                    <option value="403">403</option>
                    <option value="404">404</option>
                </optgroup>

                <optgroup label="Piso 5">
                    <option value="501">501</option>
                    <option value="502">502</option>
                    <option value="503">503</option>
                    <option value="504">504</option>
                </optgroup>

            </select>


            <label for="residente">
                Residente
            </label>

            <select id="residente" required disabled>

                <option value="">
                    Primero selecciona un departamento
                </option>

            </select>


            <hr>


            <label for="visitante">
                Nombre del visitante
            </label>

            <input
                type="text"
                id="visitante"
                placeholder="Nombre completo"
                required
            >


            <label for="tipo">
                Tipo de visitante
            </label>

            <select id="tipo" required>

                <option value="">
                    Seleccionar tipo...
                </option>

                <option value="Familia">
                    Familia
                </option>

                <option value="Amigo">
                    Amigo
                </option>

                <option value="Proveedor">
                    Proveedor
                </option>

                <option value="Taxi">
                    Taxi / Uber / Didi
                </option>

                <option value="Técnico">
                    Técnico
                </option>

                <option value="Repartidor">
                    Repartidor
                </option>

                <option value="Otro">
                    Otro
                </option>

            </select>


            <label>
                Fecha y hora
            </label>

            <input
                type="text"
                id="timestamp"
                readonly
            >


            <button type="submit">
                Registrar
            </button>

        </form>

    </section>


    <!-- ======================================
         REGISTRAR RESIDENTE
    ======================================= -->

    <section>

        <h2>Registrar Nuevo Residente</h2>

        <p class="description">
            Utiliza este formulario cuando una persona
            se mude a un departamento.
        </p>

        <form id="residenteForm">

            <label for="nuevoNombre">
                Nombre del residente
            </label>

            <input
                type="text"
                id="nuevoNombre"
                placeholder="Nombre completo"
                required
            >


            <label for="nuevoDepartamento">
                Departamento
            </label>

            <select
                id="nuevoDepartamento"
                required
            >

                <option value="">
                    Seleccionar departamento...
                </option>

                <optgroup label="Piso 1">
                    <option value="101">101</option>
                    <option value="102">102</option>
                    <option value="103">103</option>
                    <option value="104">104</option>
                </optgroup>

                <optgroup label="Piso 2">
                    <option value="201">201</option>
                    <option value="202">202</option>
                    <option value="203">203</option>
                    <option value="204">204</option>
                </optgroup>

                <optgroup label="Piso 3">
                    <option value="301">301</option>
                    <option value="302">302</option>
                    <option value="303">303</option>
                    <option value="304">304</option>
                </optgroup>

                <optgroup label="Piso 4">
                    <option value="401">401</option>
                    <option value="402">402</option>
                    <option value="403">403</option>
                    <option value="404">404</option>
                </optgroup>

                <optgroup label="Piso 5">
                    <option value="501">501</option>
                    <option value="502">502</option>
                    <option value="503">503</option>
                    <option value="504">504</option>
                </optgroup>

            </select>


            <button type="submit">
                Registrar Residente
            </button>

        </form>

    </section>


    <!-- ======================================
         LISTA DE VISITAS
    ======================================= -->

    <section>

        <h2>Lista de Visitas</h2>

        <table>

            <thead>

                <tr>

                    <th>Visitante</th>
                    <th>Departamento</th>
                    <th>Residente</th>
                    <th>Tipo</th>
                    <th>Fecha y hora</th>

                </tr>

            </thead>

            <tbody id="visitasTable">

            </tbody>

        </table>

    </section>


    <!-- ======================================
         LISTA DE RESIDENTES
    ======================================= -->

    <section>

        <h2>Residentes Registrados</h2>

        <table>

            <thead>

                <tr>

                    <th>Nombre</th>
                    <th>Departamento</th>

                </tr>

            </thead>

            <tbody id="residentesTable">

            </tbody>

        </table>

    </section>

</main>


<script src="app.js"></script>

</body>

</html>
